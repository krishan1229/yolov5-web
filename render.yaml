services:
  - type: web
    name: yolo-custom-api
    runtime: python
    buildCommand: "git clone https://github.com && cp -r yolov5/* . && pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
